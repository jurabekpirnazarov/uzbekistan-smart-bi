# Tool configuration for the whole repository. The installable backend package is in backend/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["frontend", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "pipelines", "mcp_server", "ml", "agents", "rag"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# Verified asset from PLAN.md — do not restyle it.
"pipelines/siat_ingest.py" = ["ALL"]
# Multilingual keyword tables and markdown answer templates read better unwrapped.
"backend/app/services/agent_fallback.py" = ["E501"]
# Markdown report and PromQL dashboard templates.
"ml/evaluation/run_all.py" = ["E501"]
"monitoring/grafana/build_dashboards.py" = ["E501"]
"backend/app/db/schema_doc.py" = ["E501"]

[tool.ruff.format]
exclude = ["pipelines/siat_ingest.py"]
