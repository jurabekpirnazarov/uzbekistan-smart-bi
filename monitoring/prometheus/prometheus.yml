global:
  scrape_interval: 15s
  evaluation_interval: 30s

# rule_files:            # added in Phase 10
#   - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp:8100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
