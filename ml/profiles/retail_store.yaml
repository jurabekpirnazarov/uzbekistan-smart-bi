business_type: retail_store
display_name: {en: Retail store, uz: Chakana do‘kon, ru: Розничный магазин}
keywords: [retail, shop, store, clothing, do‘kon, "do'kon", dokon, chakana, магазин, розниц]
min_budget_uzs: 200_000_000
default_level: district
factors:
  - {feature: population,        weight: 0.20, direction: "+", label: Large population}
  - {feature: trade_per_capita,  weight: 0.25, direction: "+", label: Trade spending per person}
  - {feature: trade_growth,      weight: 0.15, direction: "+", label: Trade growth}
  - {feature: urbanization,      weight: 0.10, direction: "+", label: Urban demand}
  - {feature: population_growth, weight: 0.10, direction: "+", label: Growing population}
  - {feature: business_density,  weight: 0.10, direction: "-", label: Low competition}
  - {feature: new_business_rate, weight: 0.10, direction: "+", label: Business dynamism}
normalization: percentile
