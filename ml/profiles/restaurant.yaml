business_type: restaurant
display_name: {en: Restaurant, uz: Restoran, ru: Ресторан}
keywords: [restaurant, restoran, oshxona, choyxona, ресторан, столов]
min_budget_uzs: 500_000_000
default_level: district
factors:
  - {feature: population,               weight: 0.20, direction: "+", label: Large population}
  - {feature: food_services_per_capita, weight: 0.25, direction: "+", label: Food-service spending}
  - {feature: food_services_growth,     weight: 0.15, direction: "+", label: Food-service growth}
  - {feature: urbanization,             weight: 0.15, direction: "+", label: Urban demand}
  - {feature: business_density,         weight: 0.10, direction: "-", label: Low competition}
  - {feature: new_business_rate,        weight: 0.05, direction: "+", label: Business dynamism}
  - {feature: is_city,                  weight: 0.10, direction: "+", label: City location}
normalization: percentile
