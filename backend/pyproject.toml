[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbi-backend"
version = "0.1.0"
description = "Uzbekistan Smart Business Intelligence — backend services and API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.21",
    "pandas>=2.2",
    "requests>=2.32",
    "pyyaml>=6.0",
    "openai>=1.50",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "shapely>=2.0",
    "rapidfuzz>=3.6",
    "cachetools>=5.3",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
mlflow = ["mlflow>=2.14"]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["app*"]
