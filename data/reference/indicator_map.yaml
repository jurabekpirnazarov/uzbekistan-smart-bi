# SIAT dataset → internal indicator code (PLAN.md Appendix A).
# Downstream code uses only these internal codes, never raw SIAT dataset ids.
# New indicator = new entry here + `python manage.py ingest --local`. No code changes.
#
# unit_multiplier converts the source unit to the stored unit (people, UZS, units).
# additive: values may be summed across territories. Growth rates (% of previous year) are never summed.
#
# Not mapped yet (kept raw): quarterly region datasets 1582, 1588, 1589, 1777, 1780 and
# national deflators 1820, 1825 — they need the cumulative-vs-discrete check from PLAN.md Phase 1.

indicators:
  # --- population (district / region / country) ---
  population_total:
    siat_dataset_id: 246
    name_en: Permanent population, total
    category: population
    source_unit: thousand people
    unit: persons
    unit_multiplier: 1000
    additive: true
    higher_is_better: true
  population_urban:
    siat_dataset_id: 248
    name_en: Permanent population, urban
    category: population
    source_unit: thousand people
    unit: persons
    unit_multiplier: 1000
